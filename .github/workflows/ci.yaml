name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install shell validation tools
        run: |
          # The macOS image ships Bash 3.2 and does not list ripgrep or ShellCheck.
          brew install bash ripgrep shellcheck
          printf '%s/bin\n' "$(brew --prefix bash)" >> "$GITHUB_PATH"
      - name: Check shell scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh
      - name: Check release isolation
        shell: bash
        run: |
          bash_bin="$(brew --prefix bash)/bin/bash"
          "$bash_bin" -c '(( BASH_VERSINFO[0] >= 4 ))'
          log="$(mktemp "${RUNNER_TEMP}/release-gate.XXXXXX")"
          "$bash_bin" scripts/release-gate.sh 2>&1 | tee "$log"
          tail -n 1 "$log" | grep '^PASS release gate:' >/dev/null
      - name: Install validation tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest
          go install github.com/zchee/goimports-rereviser/v4@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Check workflows
        run: actionlint
      - name: Check gofmt
        run: |
          files="$(gofmt -s -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Check gofumpt
        run: |
          gofumpt -w -extra .
          git diff --exit-code
      - name: Check modern Go usage
        run: |
          modernize -test ./...
          GOFLAGS=-tags=agentctl_testing modernize -test ./...
      - name: Check imports
        run: |
          goimports-rereviser -project-name=github.com/zchee/agentctl -use-cache -cache-fast-skip -rm-unused -set-alias -recursive .
          git diff --exit-code
      - name: Vet
        run: |
          go vet ./...
          go vet -tags agentctl_testing ./...
      - name: Lint
        run: |
          golangci-lint config verify
          golangci-lint run ./...
          golangci-lint run --build-tags agentctl_testing ./...
      - name: Test
        run: |
          go test -race -count=1 -timeout=30m ./...
          go test -tags agentctl_testing -race -count=1 -timeout=30m ./...

  linux:
    # Full Linux support is deferred; run build, vet, and untagged unit tests only.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test the testing build
        # Its own gate: the untagged Test step above still fails on Linux,
        # and the default success() condition would skip this step with it.
        if: ${{ !cancelled() }}
        # The fake security(1) is a POSIX shell script, so the testing build's
        # keychain writes and the swap and refresh scripts run here too, under
        # dash. Left out until Linux support lands, because process
        # observation is darwin-only (these already failed on linux/amd64 at
        # aaa26c1): ./internal/secret, ./internal/runtime/signals and
        # ./internal/provider/codex, and from the root package's scripts
        # e2e_accounts and e2e_swap. The root package runs its scripts below.
        run: |
          go test -tags agentctl_testing -count=1 \
            ./fixtures \
            ./internal/app \
            ./internal/cli \
            ./internal/commands \
            ./internal/commands/codex \
            ./internal/config \
            ./internal/errs \
            ./internal/lockfile \
            ./internal/provider \
            ./internal/provider/claude \
            ./internal/provider/claude/desktop \
            ./internal/render \
            ./internal/runtime/cleanup \
            ./internal/runtime/coordinator \
            ./internal/runtime/desktop \
            ./internal/runtime/fault \
            ./internal/runtime/lockorder \
            ./internal/runtime/logbuf \
            ./internal/runtime/proc \
            ./internal/runtime/tty \
            ./internal/testutil \
            ./internal/tui \
            ./internal/usage \
            ./schemas
          go test -tags agentctl_testing -count=1 -run 'TestScripts|TestTaggedBuild' -skip 'TestScripts/(e2e_accounts|e2e_swap)$' .
